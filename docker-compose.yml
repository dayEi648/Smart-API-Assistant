# Smart API Assistant — 阿里云 ECS 部署编排
# 本文件定义了应用运行所需的全部基础设施容器
# 在阿里云 ECS 上执行：docker compose up -d
#
# 注意：国内服务器拉取 Docker Hub 镜像可能较慢，建议先配置阿里云镜像加速器：
#   sudo mkdir -p /etc/docker
#   sudo tee /etc/docker/daemon.json <<-'EOF'
#   {
#     "registry-mirrors": ["https://<你的加速器地址>.mirror.aliyuncs.com"]
#   }
#   EOF
#   sudo systemctl daemon-reload && sudo systemctl restart docker
# 加速器地址可在阿里云容器镜像服务控制台获取。

services:
  # Redis — 会话缓存，多轮对话上下文（AOF 持久化）
  redis:
    image: redis:7-alpine
    container_name: sma-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chroma — 向量数据库，存储 API 文档 Embedding
  chroma:
    image: chromadb/chroma:latest
    container_name: sma-chroma
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma

  # PostgreSQL — 对话历史持久化存储
  postgres:
    image: postgres:16-alpine
    container_name: sma-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: sma
      POSTGRES_PASSWORD: sma_password
      POSTGRES_DB: sma_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sma -d sma_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端应用 — FastAPI + Agent 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sma-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:
  postgres_data:
